# Production stack (single node): Postgres + Redis + API + web + admin on one host.
# Host ports: web 3000, admin 3001, API 4000 — matches deploy/nginx/estio.conf.
#
# Split production (VM 900 worker / 901 app / 902 DB): use docker-compose.prod.split.yml
# on the app host and docker-compose.prod.postgres.yml on the DB host — see deploy/SPLIT_ARCHITECTURE.md.
#
#   export POSTGRES_PASSWORD='strong-secret'
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Optional: copy deploy/env.prod.example to .env (same folder as this file).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: estio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_estio_db}
      POSTGRES_DB: estio
    volumes:
      - estio_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estio -d estio"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 8

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    # So Nest can reach an SSH reverse tunnel on the HOST (e.g. :9000) via MEDIA_WORKER_URL=http://host.docker.internal:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    ports:
      - "4000:4000"
    volumes:
      - estio_uploads:/app/apps/api/uploads
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "4000"
      DATABASE_URL: postgresql://estio:${POSTGRES_PASSWORD:-changeme_estio_db}@postgres:5432/estio?schema=public
      # Auth / admin
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-in-prod}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      # Preview
      PREVIEW_TOKEN: ${PREVIEW_TOKEN:-}
      # Media: used when persisting uploaded asset URLs
      PUBLIC_FILE_BASE_URL: ${PUBLIC_FILE_BASE_URL:-http://127.0.0.1:4000}
      # On-demand revalidation
      WEB_REVALIDATE_URL: ${WEB_REVALIDATE_URL:-http://web:3000}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      # Ask Estio AI — DEEPSEEK_API_KEY comes from env_file (.env); omit here so an empty
      # compose substitution does not override a real key in .env.
      ASK_ESTIO_AI_ENABLED: ${ASK_ESTIO_AI_ENABLED:-true}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      ASK_ESTIO_AI_IP_SALT: ${ASK_ESTIO_AI_IP_SALT:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      WORKSTATION_URL: ${WORKSTATION_URL:-}
      WORKSTATION_SECRET: ${WORKSTATION_SECRET:-}
      MEDIA_WORKER_URL: ${MEDIA_WORKER_URL:-}
      MEDIA_WORKER_TIMEOUT_MS: ${MEDIA_WORKER_TIMEOUT_MS:-660000}
      MEDIA_WORKER_HEALTH_TIMEOUT_MS: ${MEDIA_WORKER_HEALTH_TIMEOUT_MS:-10000}
      # Set to true briefly to expose GET /media/worker-debug (then remove or set false)
      MEDIA_WORKER_DEBUG: ${MEDIA_WORKER_DEBUG:-false}
      MEDIA_WORKER_MODE: ${MEDIA_WORKER_MODE:-sync}
      MEDIA_WORKER_ASYNC_SUBMIT_PATH: ${MEDIA_WORKER_ASYNC_SUBMIT_PATH:-}
      MEDIA_WORKER_ASYNC_SUBMIT_PATH_TEXT_TO_IMAGE: ${MEDIA_WORKER_ASYNC_SUBMIT_PATH_TEXT_TO_IMAGE:-}
      MEDIA_WORKER_ASYNC_SUBMIT_PATH_IMAGE_TO_VIDEO: ${MEDIA_WORKER_ASYNC_SUBMIT_PATH_IMAGE_TO_VIDEO:-}
      MEDIA_WORKER_ASYNC_SUBMIT_PATH_TEXT_TO_VIDEO: ${MEDIA_WORKER_ASYNC_SUBMIT_PATH_TEXT_TO_VIDEO:-}
      MEDIA_WORKER_SYNC_PATH_IMAGE_TO_VIDEO: ${MEDIA_WORKER_SYNC_PATH_IMAGE_TO_VIDEO:-}
      MEDIA_WORKER_SYNC_PATH_TEXT_TO_VIDEO: ${MEDIA_WORKER_SYNC_PATH_TEXT_TO_VIDEO:-}
      MEDIA_WORKER_ASYNC_JOB_BASE_PATH: ${MEDIA_WORKER_ASYNC_JOB_BASE_PATH:-}
      MEDIA_WORKER_ASYNC_SUBMIT_TIMEOUT_MS: ${MEDIA_WORKER_ASYNC_SUBMIT_TIMEOUT_MS:-}
      MEDIA_WORKER_ASYNC_POLL_REQUEST_TIMEOUT_MS: ${MEDIA_WORKER_ASYNC_POLL_REQUEST_TIMEOUT_MS:-}
      MEDIA_WORKER_ASYNC_POLL_INTERVAL_MS: ${MEDIA_WORKER_ASYNC_POLL_INTERVAL_MS:-}
      MEDIA_WORKER_ASYNC_JOB_ID_KEYS: ${MEDIA_WORKER_ASYNC_JOB_ID_KEYS:-}
      MEDIA_WORKER_ASYNC_STATUS_JSON_FIELD: ${MEDIA_WORKER_ASYNC_STATUS_JSON_FIELD:-}
      # ComfyUI-style results: playback URL + optional GET /media/comfy-view proxy to worker/Comfy
      MEDIA_JOB_VIEW_BASE_URL: ${MEDIA_JOB_VIEW_BASE_URL:-}
      MEDIA_JOB_VIEW_PATH: ${MEDIA_JOB_VIEW_PATH:-}
      MEDIA_JOB_VIEW_PROXY_UPSTREAM: ${MEDIA_JOB_VIEW_PROXY_UPSTREAM:-}
      MEDIA_JOB_VIEW_UPSTREAM_PATH: ${MEDIA_JOB_VIEW_UPSTREAM_PATH:-/view}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:4000}
        NEXT_PUBLIC_SHOW_ASK_ESTIO_AI: ${NEXT_PUBLIC_SHOW_ASK_ESTIO_AI:-true}
        NEXT_PUBLIC_MEDIA_JOB_VIEW_BASE_URL: ${NEXT_PUBLIC_MEDIA_JOB_VIEW_BASE_URL:-}
        NEXT_PUBLIC_MEDIA_JOB_VIEW_PATH: ${NEXT_PUBLIC_MEDIA_JOB_VIEW_PATH:-/view}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_URL: http://api:4000
      PREVIEW_TOKEN: ${PREVIEW_TOKEN:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:4000}
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://127.0.0.1:3000}
      NEXT_PUBLIC_PREVIEW_TOKEN: ${NEXT_PUBLIC_PREVIEW_TOKEN:-}
    depends_on:
      - api

volumes:
  estio_pg_data:
  estio_uploads:
