# Estio: allow SSH reverse forwards to bind on 0.0.0.0 so `ssh -R 0.0.0.0:9000:...`
# from the workstation reaches Docker via host.docker.internal without a socat bridge.
# Install: sudo cp deploy/sshd/99-estio-gateway-ports.conf /etc/ssh/sshd_config.d/
#         sudo sshd -t && sudo systemctl reload ssh
#
# After this, reconnect the workstation tunnel with:
#   ssh -N -R 0.0.0.0:9000:127.0.0.1:<worker_port> user@estio-server
# Then you may disable estio-docker-worker-bridge.service if port 9000 is fully bound on 0.0.0.0.

AllowTcpForwarding yes
GatewayPorts clientspecified
