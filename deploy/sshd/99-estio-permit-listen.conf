# Estio: only allow reverse-forwards (`ssh -R`) to bind on :9000 (the canonical
# GPU-worker tunnel). Any other port (e.g. the leaky :19000 attempt that broke
# image/video generation in April 2026) is refused by sshd, so a misconfigured
# workstation supervisor can never accidentally publish a dead listener on this
# VM again.
#
# Companion to:
#   - 99-estio-gateway-ports.conf   (AllowTcpForwarding yes, GatewayPorts clientspecified)
#   - 99-estio-worker-tunnel.conf   (PubkeyAuthentication yes)
#
# Install:
#   sudo cp deploy/sshd/99-estio-permit-listen.conf /etc/ssh/sshd_config.d/
#   sudo sshd -t && sudo systemctl reload ssh
#
# Verify:
#   ss -tlnp | grep -E ':9000|:19000'    # expect ONLY :9000
#   sudo journalctl -u ssh -n 30         # workstation reconnects will be visible but harmless
PermitListen 9000
