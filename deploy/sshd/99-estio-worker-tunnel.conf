# Install on production: sudo cp deploy/sshd/99-estio-worker-tunnel.conf /etc/ssh/sshd_config.d/
# Then: sudo sshd -t && sudo systemctl reload ssh || sudo systemctl reload sshd
#
# Allows workstation `ssh -R 0.0.0.0:9000:...` for the media worker tunnel (see deploy/MEDIA_WORKER.md).

AllowTcpForwarding yes
GatewayPorts clientspecified
PubkeyAuthentication yes
