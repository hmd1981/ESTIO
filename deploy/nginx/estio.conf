# Estio — host routing (web :3000, admin :3001, API :4000 on localhost).
# TLS on 443 uses Cloudflare Origin cert (Full / Full strict). Port 80 works for Flexible or health checks.
#
# TODO(throttler / abuse): make the API see the real client IP (not the
# Cloudflare edge IP) so @nestjs/throttler can rate-limit per-user instead of
# per-CF-PoP. Add `set_real_ip_from <cf-ipv4-range>;` lines (see
# https://www.cloudflare.com/ips/) followed by `real_ip_header CF-Connecting-IP;`
# inside each `server { ... 443 ... }` block, then reload nginx. Until that
# lands, the throttler still works but its bucket key is the CF edge IP, which
# can collapse many users behind one PoP into a single quota.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name estio.org www.estio.org;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.estio.org;

    location / {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.estio.org;

    location / {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# media.estio.org — same origin as API (uploads, static files). Point Cloudflare A/Proxied to this host.
server {
    listen 80;
    listen [::]:80;
    server_name media.estio.org;

    location / {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── HTTPS (same upstreams) — /etc/ssl/cloudflare/estio-origin.{pem,key} ───

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name estio.org www.estio.org;

    ssl_certificate     /etc/ssl/cloudflare/estio-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/estio-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

