# Local development only. Volume name is intentionally NOT `estio_postgres` so that on a host
# that also runs `docker-compose.prod.yml`, `docker volume ls` clearly shows:
#   estio-platform_estio_pg_data   ← production Postgres (compose.prod)
#   estio-platform_estio_dev_pg_data ← this dev DB (different data)
# Using the old name `estio_postgres` on the same machine as prod created a second full PG
# cluster that looked like “the” database but was empty — a common source of “everything vanished”.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: estio
      POSTGRES_PASSWORD: estio
      POSTGRES_DB: estio
    ports:
      - "5433:5432"
    volumes:
      - estio_dev_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estio -d estio"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - estio_redis:/data
    command: redis-server --appendonly yes

volumes:
  estio_dev_pg_data:
  estio_redis:
