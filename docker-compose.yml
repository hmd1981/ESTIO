services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: estio
      POSTGRES_PASSWORD: estio
      POSTGRES_DB: estio
    ports:
      - "5433:5432"
    volumes:
      - estio_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estio -d estio"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - estio_redis:/data
    command: redis-server --appendonly yes

volumes:
  estio_postgres:
  estio_redis:
